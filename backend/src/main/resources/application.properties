spring.application.name=backend

# =========================
# MySQL
# =========================

spring.datasource.url=jdbc:mysql://localhost:3306/lab_management_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=040410
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================
# MyBatis
# =========================

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.nlt.domain.entity
mybatis.mapper-locations=classpath*:mapper/*.xml


# =========================
# Encoding
# =========================

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true


# =========================
# JWT
# =========================

security.jwt.secret=lab-management-system-jwt-secret-key-2026
security.jwt.expiration-ms=86400000
